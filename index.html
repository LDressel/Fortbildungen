<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortbildungen – Materialien</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f5fb;color:#241b33;line-height:1.5}
  header{background:#45237a;color:#fff;padding:28px 20px}
  .wrap{max-width:960px;margin:0 auto}
  h1{margin:0;font-size:1.7rem}
  header p{margin:6px 0 0;opacity:.85}
  main{max-width:960px;margin:0 auto;padding:24px 20px 60px}
  .kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .kachel{background:#fff;border:2px solid #e4ddef;border-radius:16px;padding:18px;text-decoration:none;color:inherit;display:flex;gap:14px;align-items:center;transition:.15s}
  .kachel:hover{border-color:#6a43a8;transform:translateY(-2px);box-shadow:0 6px 18px rgba(69,35,122,.12)}
  .kachel img{width:72px;height:72px;border-radius:50%}
  .t{font-weight:700;font-size:1.1rem}
  .s{color:#6b6478;font-size:.95rem}
</style>
</head>
<body>
<header><div class="wrap"><h1>Fortbildungen</h1><p>Materialien zu meinen Fortbildungen – einfach eine Fortbildung auswählen.</p></div></header>
<main>
  <div class="kacheln">
    <a class="kachel" href="ais-chat-grundschule/">
      <img src="ais-chat-grundschule/bilder/robo-bit.png" alt="">
      <div><div class="t">AIS.chat in der Grundschule</div><div class="s">Lernszenarien und Dialogpartner zum Kopieren – nach Klasse, Fach und Thema</div></div>
    </a>
    <!-- Weitere Fortbildungen hier als neue Kachel ergänzen -->
  </div>
</main>
</body>
</html>
